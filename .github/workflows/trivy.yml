name: Trivy Security Scan

on:
  pull_request:
    branches:
      - main
    # No paths: filter — a required check must report on every PR, and the
    # secret scan covers docs and agent config too.

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trivy:
    uses: krypsis-io/.github/.github/workflows/trivy.yml@main
