name: Trivy Security Scan

on:
  pull_request:
    branches:
      - main
    # No paths: filter. The scan takes well under a minute, and a required
    # status check that never reports on a docs-only PR blocks that PR
    # instead of passing it, so it has to run on every PR to be required.

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trivy:
    uses: krypsis-io/.github/.github/workflows/trivy.yml@main
