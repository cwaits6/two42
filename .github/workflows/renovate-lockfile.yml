# Mend-hosted Renovate opens npm PRs without regenerating package-lock.json
# (its artifact step has not run for this repo since late September), so
# `npm ci` fails every job on them; a Supabase CLI pin bump likewise lands
# without the regenerated database.types.ts the pgtap job byte-compares.
# This job runs the steps Renovate skipped and pushes the result back to the
# Renovate branch. It pushes with the App token (a GITHUB_TOKEN push would
# not re-trigger CI) under the github-actions[bot] identity, which
# renovate.json5 lists in gitIgnoredAuthors so Renovate keeps rebasing and
# automerging the branch as its own. When Renovate rebases and drops the
# commit, `synchronize` fires and this runs again — self-healing by design.
name: Renovate lockfile sync

on:
  pull_request:
    branches: [ci/renovate-lockfile-sync]  # TEST VARIANT
    paths:
      - package.json
      - .github/workflows/supabase.yml

concurrency:
  group: renovate-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Sync lockfile and generated types
    # Same-repo PRs by Renovate only: the job pushes with a write token, so
    # it must never run for a fork or a human branch.
    if: >-
      github.event.pull_request.user.login == 'cwaits6' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The same command Renovate's npm artifact updater runs. --ignore-scripts
      # because this checkout is a dependency bump nobody has reviewed yet.
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify the lockfile satisfies package.json
        run: npm ci --dry-run --ignore-scripts --no-audit --no-fund

      # A Supabase CLI pin bump changes the generated types' formatting, and
      # the pgtap job compares them byte-for-byte against the pinned CLI's
      # output, so they must be regenerated with the PR's pin, not main's.
      - name: Detect a Supabase CLI pin change
        id: pin
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          old=$(git show "origin/$BASE_REF:.github/workflows/supabase.yml" | grep -m1 -oE 'version: [0-9][0-9.]*' | cut -d' ' -f2)
          new=$(grep -m1 -oE 'version: [0-9][0-9.]*' .github/workflows/supabase.yml | cut -d' ' -f2)
          echo "old=$old new=$new"
          if [ -n "$new" ] && [ "$old" != "$new" ]; then
            echo "version=$new" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.pin.outputs.version != ''
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: Regenerate database types with the new CLI
        if: steps.pin.outputs.version != ''
        run: |
          supabase db start
          npm run db:types

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lib/supabase/database.types.ts
          if git diff --staged --quiet; then
            echo "Lockfile and types already in sync"
            exit 0
          fi
          git diff --staged --stat
          git commit -m "chore(deps): sync lockfile and generated types with the dependency bump"
          git push origin "HEAD:$HEAD_REF"
