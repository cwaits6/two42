name: Check scheduled jobs

# Fails, which emails the maintainer, when a cron firing in the last six
# hours didn't run or didn't get a 200 back: the hourly serving reminders,
# clean-up-expired-data at 09:00 UTC, and the 15:00 UTC reminder jobs. Every
# six hours, which is pg_net's response retention, so no firing is missed.
# Read-only against the hosted database; see scripts/README.md.

on:
  schedule:
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the last six hours of firings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Link to Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Read the firings since the last check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # --read-only needs no confirmation on the hosted project. The rows
          # come back bare or wrapped in .rows, depending on the CLI version.
          # With --output-format json the CLI writes its error to stdout, so a
          # failed query is printed here or the log would hold nothing.
          if ! output="$(npx supabase db query --remote --read-only -f scripts/check-scheduled-jobs.sql --output-format json)"; then
            printf '%s\n' "$output"
            exit 1
          fi
          result="$(printf '%s' "$output" | jq -c '(if type == "array" then . else .rows end)[0].result')"
          printf '%s\n' "$result" | jq .
          # An empty or reshaped result must fail too, so this requires the array.
          printf '%s' "$result" | jq -e '.problems | type == "array" and length == 0' > /dev/null
