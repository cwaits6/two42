name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No paths: filter on the workflow. A gate that can be skipped by not
# touching a path in a filter list is not a gate, and the lint, unit and
# guard jobs are cheap enough to always run. The e2e job is the exception:
# it builds the app and boots a Supabase stack, so it gates on its own
# changed-path list in-job, where a skip still reports a passing check.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The lint script carries --max-warnings=0, so a warning fails this
      # job — warnings are not advisory here.
      - name: Run ESLint
        run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:run

  tenancy-guard:
    name: Service-role org_id guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The guard derives its scan set from `git ls-files`, which reads the
      # index — the default shallow checkout is sufficient.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Run service-role org_id guard
        run: npm run guard:tenancy

  # Browser guard rails for the tenancy and visibility boundaries. Runs the
  # production build against an ephemeral local Supabase stack — the same
  # kind the pgtap job uses; the remote project is never touched.
  e2e:
    name: Playwright boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    permissions:
      contents: read
    steps:
      # First because every later step opens outgoing connections, and the
      # kernel may pick their source ports from this block. 54320-54329 holds
      # every ephemeral-range host port the pinned CLI defaults to, and
      # config.toml overrides none; of them the job's stack binds 54321 and
      # 54322. A reservation evicts nothing and does not stop an explicit
      # bind, so the listing is what shows a socket that was already there.
      - name: Reserve the Supabase ports
        run: |
          existing=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          echo "Already reserved: ${existing:-none}"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${existing:+$existing,}54320-54329"
          sudo ss -tanp '( sport >= :54320 and sport <= :54329 )'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The path filter lives inside the job rather than on the workflow so
      # the check always reports: a required check that never reports blocks
      # the PR forever. Only these paths can change what the specs see.
      - name: Check whether the change can reach the suite
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -Eq '^(app|components|lib|e2e)/|^supabase/migrations/|^supabase/seed\.sql$|^supabase/config\.toml$|^playwright\.config\.ts$|^package\.json$|^package-lock\.json$|^next\.config\.ts$|^proxy\.ts$|^instrumentation\.ts$|^\.github/workflows/test\.yml$|^scripts/start-supabase-stack\.sh$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Playwright boundaries: ran" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Playwright boundaries: skipped — no gated paths changed" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Playwright boundaries skipped (no gated paths changed)"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 26
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      # The pinned CLI from package.json applies the migrations and seed.sql.
      # Services the specs never reach are left out to keep the start short.
      - name: Start the local Supabase stack
        if: steps.changes.outputs.run == 'true'
        run: scripts/start-supabase-stack.sh -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector

      - name: Point the build at the local stack
        if: steps.changes.outputs.run == 'true'
        # The service key is the ephemeral stack's own: the token pages the
        # suite visits (/join/<token>) read their anchor row on the service
        # client, and it is logged nowhere.
        run: |
          npx supabase status -o env | sed -n \
            -e 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p' \
            -e 's/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            | tee -a "$GITHUB_ENV"
          npx supabase status -o env | sed -n \
            -e 's/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SECRET_KEY=\1/p' >> "$GITHUB_ENV"
          test "$(grep -c '^NEXT_PUBLIC_SUPABASE_' "$GITHUB_ENV")" -eq 2
          test "$(grep -c '^SUPABASE_SECRET_KEY=' "$GITHUB_ENV")" -eq 1

      # The .deb files the cache carries are built for one OS release.
      - name: Resolve the Playwright cache key
        if: steps.changes.outputs.run == 'true'
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        id: browsers
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}

      # Keeps the .deb files apt fetched so a cache hit installs them from disk.
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium
          mkdir -p ~/.cache/playwright-apt
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
          ls -l ~/.cache/playwright-apt

      # A hit installs the cached .deb files, so the apt mirror is reached only
      # when the dry run still finds a package missing.
      - name: Install Chromium system dependencies
        if: steps.changes.outputs.run == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          missing=()
          for deb in ~/.cache/playwright-apt/*.deb; do
            package=$(dpkg-deb --field "$deb" Package)
            if [ "$(dpkg-query --show --showformat='${db:Status-Status}' "$package" 2>/dev/null)" != installed ]; then
              missing+=("$deb")
            fi
          done
          echo "Installing ${#missing[@]} cached package(s)"
          if { [ ${#missing[@]} -eq 0 ] || sudo dpkg --install "${missing[@]}"; } \
            && npx playwright install-deps --dry-run chromium; then
            exit 0
          fi
          echo "::warning::The cached packages did not cover Chromium's dependencies; installing from the apt mirror"
          sudo apt-get update
          sudo apt-get --fix-broken install -y
          npx playwright install-deps chromium

      - name: Run the suite
        if: steps.changes.outputs.run == 'true'
        run: npm run test:e2e

      - name: Upload the HTML report
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
