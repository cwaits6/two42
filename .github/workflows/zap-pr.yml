name: ZAP Baseline Scan (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Only scan PRs that can affect the deployed app. Later patterns override
    # earlier ones: .github/** is excluded as a whole, but this workflow and its
    # comment script are re-included so changes to the scan itself still run it.
    # .zap/ (suppression rules) is intentionally NOT excluded.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/zap-pr.yml'
      - '.github/scripts/zap_pr_comment.py'
      - '!.claude/**'
      - '!.agents/**'
      - '!.archon/**'
      - '!.coderabbit.yaml'
      - '!renovate.json5'
      - '!.releaserc.json'
      - '!.gitignore'
      - '!.env.example'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan instead of building the app (useful when testing workflow changes)'
        required: true
        type: string

# Cancel in-progress scans when a new commit is pushed.
# For workflow_dispatch (no PR number), use run ID so manual runs don't cancel each other.
concurrency:
  group: zap-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # First because every later step opens outgoing connections, and the
      # kernel may pick their source ports from the block the stack binds.
      - name: Reserve the Supabase ports
        if: github.event_name == 'pull_request'
        run: |
          existing=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          echo "Already reserved: ${existing:-none}"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${existing:+$existing,}54320-54329"
          sudo ss -tanp '( sport >= :54320 and sport <= :54329 )'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests get no Vercel preview, so the scan runs against the PR's
      # own build on a local stack, the same way the weekly full scan does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 26
          cache: npm

      - run: npm ci
        if: github.event_name == 'pull_request'

      - name: Start the local Supabase stack
        if: github.event_name == 'pull_request'
        run: scripts/start-supabase-stack.sh -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector

      - name: Point the build at the local stack
        if: github.event_name == 'pull_request'
        run: |
          npx supabase status -o env | sed -n \
            -e 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p' \
            -e 's/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            | tee -a "$GITHUB_ENV"
          npx supabase status -o env | sed -n \
            -e 's/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SECRET_KEY=\1/p' >> "$GITHUB_ENV"
          test "$(grep -c '^NEXT_PUBLIC_SUPABASE_' "$GITHUB_ENV")" -eq 2
          test "$(grep -c '^SUPABASE_SECRET_KEY=' "$GITHUB_ENV")" -eq 1

      - name: Build and start the app
        if: github.event_name == 'pull_request'
        run: |
          npx next build
          nohup npx next start -p 3142 > /dev/null 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused -o /dev/null http://localhost:3142/

      - name: Choose the URL to scan
        id: deployment
        env:
          MANUAL_URL: ${{ inputs.target_url }}
        run: echo "target=${MANUAL_URL:-http://localhost:3142}" >> "$GITHUB_OUTPUT"

      # Baseline scan: passive + spider only, no active attack (~3-5 min).
      # allow_issue_writing: false — findings go to the PR comment below, not a GitHub issue.
      # fail_action: false — we handle suppression and hard-fail ourselves so we can post
      # the PR comment before failing.
      # ZAP_AUTH_HEADER/VALUE: tells ZAP to inject the Vercel bypass header on every request,
      # for a manual run against a protected Vercel URL.
      # Using env vars avoids -config flags which clash with argparse's -c (config file) flag.
      # If the secret is unset, ZAP_AUTH_HEADER is empty and ZAP skips the header entirely.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        env:
          ZAP_AUTH_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' && 'x-vercel-protection-bypass' || '' }}
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ steps.deployment.outputs.target }}
          fail_action: false
          allow_issue_writing: false

      # Post findings directly on the PR. If a ZAP comment already exists from a previous
      # scan on this PR, update it in place rather than posting a new one each time.
      # The script exits 1 if there are active (non-suppressed) findings — hard-fail the job.
      - name: Post findings as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Disable bash exit-on-error so the script's exit 1 (active findings)
          # doesn't kill the step before the comment is posted.
          set +eo pipefail

          BODY=$(python3 .github/scripts/zap_pr_comment.py)
          SCRIPT_EXIT=$?

          if [ -z "$BODY" ]; then
            BODY="## ZAP Baseline Scan — No findings :white_check_mark:"
          fi

          # Update existing comment in-place, or post a new one.
          EXISTING_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" 2>/dev/null | \
            jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## ZAP Baseline Scan")))] | last // null | .id // empty' -r)

          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING_ID" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

          if [ "$SCRIPT_EXIT" -ne 0 ]; then
            echo "::error::ZAP found security alerts. See the PR comment for details."
            exit 1
          fi
