name: Supabase

on:
  # Every PR, unfiltered: pgtap is a required check, and a required check
  # that never reports blocks the PR forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      [
        "supabase/migrations/**",
        "supabase/tests/**",
        "supabase/seed.sql",
        "supabase/functions/**",
        "lib/supabase/database.types.ts",
        ".github/workflows/supabase.yml",
        "package.json",
        "package-lock.json",
      ]

jobs:
  lint:
    name: Lint migrations
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Link to Supabase project
        run: npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Lint migrations
        run: npx supabase db lint --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Tenancy test harness. Runs entirely against an ephemeral
  # local Supabase stack: no `supabase link`, no Supabase secrets in env, so
  # it is safe for fork PRs and can never touch the remote project.
  pgtap:
    name: pgTAP tenancy harness (local only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RENOVATE_PR: >-
        ${{ github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'renovate[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start local database
        run: npx supabase db start

      # supabase/tests/site_settings_rls.sql predates pgTAP (plain SQL, no
      # TAP output) and would fail pg_prove; every other supabase/tests/*.sql
      # is discovered automatically so new suites can't be silently skipped.
      - name: Run pgTAP suite (local only — never --linked)
        run: |
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find supabase/tests -name '*.sql' ! -name 'site_settings_rls.sql' -print0 | sort -z)
          echo "Running: ${files[*]}"
          npx supabase test db "${files[@]}"

      - name: Regenerate types
        run: npm run db:types

      # Renovate bumps the CLI but cannot run it, so types drift on its branch
      # is the new CLI's output: commit it there. The App token makes the
      # commit signed and re-triggers CI; GITHUB_TOKEN would do neither.
      - name: Generate app token
        if: env.RENOVATE_PR == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Exits non-zero after committing so this head stays red: automerge
      # must wait for the new head, where the committed file passes the check.
      - name: Commit regenerated types to the Renovate branch
        if: env.RENOVATE_PR == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FILE: lib/supabase/database.types.ts
        run: |
          if git diff --quiet -- "$FILE"; then
            echo "Types already in sync"
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$HEAD_REF" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f message="chore(db): regenerate database types with the bumped Supabase CLI" \
            -f branch="$HEAD_REF" -f sha="$current" \
            -f content="$(base64 -w0 "$FILE")" --jq .commit.sha
          echo "Committed regenerated types; CI reruns on the new head"
          exit 1

      - name: Check generated types are up to date
        run: git diff --exit-code -- lib/supabase/database.types.ts

  # Edge function unit tests. Pure units against the
  # _shared/ modules — no network, no database.
  #
  # All three index.ts entry points are type-checked as a blocking gate:
  # their esm.sh supabase-js import is pinned to an exact
  # version with a matching deno.lock integrity entry, so the check no longer
  # depends on CDN drift — a failure is our code, not a third-party artifact
  # changing under us. A type error now fails the PR here instead of
  # surfacing post-merge in `supabase functions deploy` (migrate job below),
  # where it would block the migrations queued behind it in the same job.
  # The step still fetches the pinned artifact from esm.sh, so an esm.sh
  # outage fails this job rather than annotating it — an accepted trade:
  # a blocked PR beats a blocked migration.
  deno-test:
    name: Edge function unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Type-check shared edge function modules
        run: deno check supabase/functions/_shared/*.ts

      - name: Run edge function unit tests
        run: deno test --allow-env supabase/functions/tests/

      # Blocking: the import is pinned, so a failure here is our
      # code (or an esm.sh outage) — see the note above the job.
      # --frozen makes the pin load-bearing: without it Deno silently rewrites
      # an outdated deno.lock in CI, so the committed integrity entry would
      # never actually be enforced.
      - name: Type-check edge function entry points
        run: |
          deno check --frozen supabase/functions/send-event-reminders/index.ts \
                              supabase/functions/send-serving-reminders/index.ts

  migrate:
    name: Push migrations & dump schema
    if: github.event_name == 'push'
    needs: deno-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrate-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Link to Supabase project
        run: npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: npx supabase functions deploy send-event-reminders send-serving-reminders
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dump schema
        run: npx supabase db dump --schema public -f supabase/schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Committed through the contents API, as the Renovate types commit
      # above, so the App signs it; a git push from the runner is unsigned.
      # The dump is 200 KB, past the kernel's per-argument limit once
      # base64-encoded, so the body goes in through a file rather than -f.
      # The blob sha is re-read on each attempt because main can move
      # between the dump and the write.
      - name: Commit schema dump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FILE: supabase/schema.sql
        run: |
          if git diff --quiet -- "$FILE"; then
            echo "No schema changes to commit"
            exit 0
          fi
          base64 -w0 "$FILE" > "$RUNNER_TEMP/schema.b64"
          for i in 1 2 3; do
            if ! current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=main" --jq .sha); then
              echo "Blob sha read failed (attempt $i), retrying..."
              sleep $((i * 2))
              continue
            fi
            if jq -n --arg message "chore(db): update schema dump [skip ci]" \
                     --arg sha "$current" \
                     --rawfile content "$RUNNER_TEMP/schema.b64" \
                     '{message: $message, branch: "main", sha: $sha, content: $content}' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" --input - --jq .commit.sha; then
              exit 0
            fi
            echo "Commit failed (attempt $i), refreshing the blob sha and retrying..."
            sleep $((i * 2))
          done
          echo "All commit attempts failed"
          exit 1
