language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    # Review once when the PR is ready; a push (rebase, review fixes) does not
    # start another. Request one with `@coderabbitai review`.
    auto_incremental_review: false
    drafts: false
    base_branches:
      - main
    ignore_usernames:
      - "renovate[bot]"
    # Skip dependency-bump PRs so they don't spend a review.
    # (Renovate PRs are already covered by ignore_usernames above.)
    ignore_title_keywords:
      - "chore(deps)"
      - "fix(deps)"
      - "build(deps)"
    # Opt any PR out of auto-review by adding the "skip-review" label.
    labels:
      - "!skip-review"
  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!package-lock.json"
    - "!CHANGELOG.md"
    - "!public/**"
    - "!next-env.d.ts"

chat:
  auto_reply: true
